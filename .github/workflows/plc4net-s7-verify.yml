name: PLC4Net S7 verification tool
on:
  push:
    branches: [develop]
    paths: ['plc4net/tools/s7-verify/**', '.github/workflows/plc4net-s7-verify.yml']
  pull_request:
    paths: ['plc4net/tools/s7-verify/**', '.github/workflows/plc4net-s7-verify.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLC4X_SOURCE_ROOT: ${{ github.workspace }}/.deps/plc4x
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: apache/plc4x
          ref: 1980c1b6b29625159db0d1315b385c3f4fa32aff
          path: .deps/plc4x
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: dotnet build plc4net/tools/s7-verify/s7-verify.csproj -c Release
      - run: python plc4net/tools/s7-verify/test_cli.py -v
