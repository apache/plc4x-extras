name: .NET Platform Compatibility

on:
  push:
    branches: [develop]
    paths: ['plc4net/**', '.github/workflows/dotnet-platform.yml']
  pull_request:
    paths: ['plc4net/**', '.github/workflows/dotnet-platform.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLC4X_SOURCE_ROOT: ${{ github.workspace }}/.deps/plc4x
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the plc4net dependency
        uses: actions/checkout@v7
        with:
          repository: apache/plc4x
          ref: 1980c1b6b29625159db0d1315b385c3f4fa32aff
          path: .deps/plc4x
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build
        run: dotnet build plc4net/tools/modbus-verify/modbus-verify.csproj --configuration Release
      - name: Test the CLI with a local Modbus TCP peer
        run: python plc4net/tools/modbus-verify/test_cli.py
